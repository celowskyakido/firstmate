<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firstmate</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Firstmate</h1>
      <nav aria-label="Pages"><a href="#/">Overview</a><a href="#/machine">Machine</a></nav>
    </div>
    <div class="meta">
      <a id="health" class="health" href="#/machine">Checking machine…</a>
      <span id="freshness" role="status"></span>
      <button id="theme-toggle" class="theme-toggle" type="button">Theme: system</button>
    </div>
  </header>
  <div id="banner" role="status" hidden></div>
  <section id="alerts" role="alert" hidden></section>
  <main id="view"><p class="muted">Loading the first snapshot…</p></main>
  <dialog id="detail" aria-labelledby="detail-title"><div id="detail-body"></div></dialog>
  <script src="/render.js"></script>
  <script src="/charts.js"></script>
  <script src="/app.js"></script>
</body>
</html>
